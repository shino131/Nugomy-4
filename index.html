<style>
/* التصميم: ملصقات بحدود سميكة وظلال صلبة، شريط علوي بالنجوم، أربعة تبويبات سفلية، وألوان ثابتة لكل مجال */
:root{
  --bg:#F2EFFF; --surface:#FFFFFF; --ink:#1E1B3F; --muted:#5B5783; --line:#1E1B3F; --shadow:#1E1B3F;
  --accent:#6B4EFF; --on-accent:#FFFFFF; --soft:#E6E0FF; --star:#FFC21A; --on-solid:#1E1B3F;
  --ok:#13875A; --bad:#C0392B;
  --c-teal:#14B8A6; --c-teal-bg:#D2F4EE; --c-blue:#3B82F6; --c-blue-bg:#DBE8FF; --c-green:#22A559; --c-green-bg:#D6F3E0;
  --c-orange:#F97316; --c-orange-bg:#FFE5D2; --c-pink:#EC4899; --c-pink-bg:#FFDCEB; --c-violet:#8B5CF6; --c-violet-bg:#E7DDFF;
  --c-red:#EF4444; --c-red-bg:#FFDADA; --c-slate:#64748B; --c-slate-bg:#E3E8EF;
  --rs:1; --bw:2px; --sh:3px;
  --font-display:'Lalezar','Cairo','Segoe UI',Tahoma,sans-serif;
  --font-body:'Cairo','Segoe UI',Tahoma,'Geeza Pro',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15122E; --surface:#221F47; --ink:#F2EFFF; --muted:#B0ACDB; --line:#8F8AD8; --shadow:#0B0920;
    --accent:#9C86FF; --on-accent:#14102E; --soft:#2E2A5C; --star:#FFC21A;
    --ok:#4CD694; --bad:#FF8A7A;
    --c-teal:#2DD4BF; --c-teal-bg:#0F3B38; --c-blue:#60A5FA; --c-blue-bg:#172C57; --c-green:#4ADE80; --c-green-bg:#123B27;
    --c-orange:#FB923C; --c-orange-bg:#4A2810; --c-pink:#F472B6; --c-pink-bg:#4B1A33; --c-violet:#A78BFA; --c-violet-bg:#2E2260;
    --c-red:#F87171; --c-red-bg:#4A1C1C; --c-slate:#94A3B8; --c-slate-bg:#2A3140;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background-color:var(--bg);background-image:var(--bgimg,none);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.cc-teal{--cc:var(--c-teal);--cb:var(--c-teal-bg)} .cc-blue{--cc:var(--c-blue);--cb:var(--c-blue-bg)} .cc-green{--cc:var(--c-green);--cb:var(--c-green-bg)}
.cc-orange{--cc:var(--c-orange);--cb:var(--c-orange-bg)} .cc-pink{--cc:var(--c-pink);--cb:var(--c-pink-bg)} .cc-violet{--cc:var(--c-violet);--cb:var(--c-violet-bg)}
.cc-red{--cc:var(--c-red);--cb:var(--c-red-bg)} .cc-slate{--cc:var(--c-slate);--cb:var(--c-slate-bg)}

.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(18px * var(--rs));box-shadow:var(--sh) var(--sh) 0 var(--shadow)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:6px 16px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.title{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.3}
.sub{color:var(--muted);font-size:15.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

/* الشريط العلوي */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:var(--bw) solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;min-width:0;text-align:start}
.av{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:var(--cc);color:var(--on-solid);border:var(--bw) solid var(--line);font-family:var(--font-display);font-size:23px;line-height:1}
.who-name{font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.top-r{display:flex;align-items:center;gap:10px}
.stars-chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;background:var(--star);color:#1E1B3F;border:var(--bw) solid var(--line);border-radius:99px;box-shadow:calc(var(--sh) * .67) calc(var(--sh) * .67) 0 var(--shadow);font-family:var(--font-display);font-size:23px}
.stars-chip.bump{animation:bump .5s}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(14px * var(--rs));box-shadow:calc(var(--sh) * .67) calc(var(--sh) * .67) 0 var(--shadow);cursor:pointer}
.icon-btn:active,.btn:active,.chipbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* الأزرار */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;padding:6px 16px;background:var(--accent);color:var(--on-accent);border:var(--bw) solid var(--line);border-radius:calc(14px * var(--rs));box-shadow:var(--sh) var(--sh) 0 var(--shadow);font-weight:700;font-size:17px;cursor:pointer}
.btn.alt{background:var(--surface);color:var(--ink)}
.btn.danger{background:var(--surface);color:var(--bad)}
.btn.small{min-height:44px;font-size:16px;width:auto}
.btn.armed{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chipbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:4px 14px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:99px;font-weight:600;font-size:16px;cursor:pointer}
.chipbtn[aria-pressed="true"],.chipbtn[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.chipbtn.cat[aria-pressed="true"],.chipbtn.cat[aria-checked="true"]{background:var(--cc);color:var(--on-solid)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* اليوم */
.hero{padding:16px;display:flex;align-items:center;gap:16px;margin-top:14px}
.ring{flex:none;position:relative;width:96px;height:96px}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:400;font-size:27px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.daynav .lbl{font-weight:700;font-size:18px;text-align:center}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:2px 12px;background:var(--soft);border-radius:99px;font-weight:600;font-size:15.5px}
.cat-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.cat-h .dot{flex:none;width:16px;height:16px;border-radius:50%;background:var(--cc);border:var(--bw) solid var(--line)}
.cat-h h2{font-family:var(--font-display);font-weight:400;font-size:23px}
.cat-h .cnt{margin-inline-start:auto;font-weight:600;color:var(--muted);font-size:16px}
.goals{display:grid;gap:10px}
.goal{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 14px;text-align:start;background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(16px * var(--rs));box-shadow:var(--sh) var(--sh) 0 var(--shadow);cursor:pointer}
.goal:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.chk{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);color:transparent}
.g-title{flex:1;min-width:0;font-weight:600;font-size:18px;line-height:1.45}
.card,.goal,.tip,.nav,.sheet,.mile,.chipbtn{-webkit-backdrop-filter:var(--glass,none);backdrop-filter:var(--glass,none)}
.tips{display:grid;gap:10px;margin-top:14px}
.tip{display:flex;align-items:flex-start;gap:12px;padding:12px 8px 12px 12px;background:var(--soft);color:var(--ink);border:var(--bw) solid var(--line);border-radius:calc(16px * var(--rs));box-shadow:calc(var(--sh) * .67) calc(var(--sh) * .67) 0 var(--shadow)}
.tip p{flex:1;min-width:0;font-weight:600;font-size:17px;line-height:1.55;padding-top:4px}
.tip-ic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--line);color:var(--on-solid);background:var(--star)}
.tip-balance .tip-ic{background:var(--c-orange)} .tip-near .tip-ic{background:var(--c-blue)} .tip-cheer .tip-ic{background:var(--star)}
.tip-x{flex:none;display:grid;place-items:center;width:44px;height:44px;margin-top:-4px;color:var(--muted);background:none;border:0;border-radius:50%;cursor:pointer}
.setrow{display:flex;align-items:center;gap:14px}
.setrow .grow{display:grid;gap:2px} .setrow b{font-size:18px}
.sw{flex:none;position:relative;width:60px;height:36px;padding:0;background:var(--surface);border:var(--bw) solid var(--line);border-radius:99px;cursor:pointer}
.sw::after{content:"";position:absolute;top:50%;inset-inline-start:4px;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--line)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{inset-inline-start:28px;background:var(--on-accent)}
.g-star{flex:none;display:flex;align-items:center;gap:3px;color:var(--muted);opacity:.45}
.g-n{direction:ltr;unicode-bidi:isolate;font-size:16px;color:var(--ink);font-family:var(--font-display)}
.goal[aria-pressed="true"]{background:var(--cb)}
.goal[aria-pressed="true"] .chk{background:var(--cc);color:var(--on-solid)}
.goal[aria-pressed="true"] .g-star{color:var(--star);opacity:1}
.goal[aria-pressed="true"] .g-star path{stroke:var(--line);stroke-width:1.5}
.goal.pop .chk{animation:pop .45s}
.goal.pop .g-star{animation:spin .6s}
.done-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--star);color:#1E1B3F;border:var(--bw) solid var(--line);border-radius:calc(16px * var(--rs));box-shadow:var(--sh) var(--sh) 0 var(--shadow);font-family:var(--font-display);font-size:22px}
.empty{padding:22px 16px;text-align:center}
.empty p{margin-bottom:12px}

/* التقدم */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.seg .chipbtn{padding-inline:2px;font-size:15.5px}
.rangenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.rangenav .lbl{font-weight:700;font-size:18px;text-align:center}
.nbtn{display:grid;place-items:center;width:46px;height:46px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(14px * var(--rs));box-shadow:calc(var(--sh) * .67) calc(var(--sh) * .67) 0 var(--shadow);cursor:pointer}
.nbtn[disabled]{opacity:.35;cursor:not-allowed}
.big{padding:16px;display:flex;align-items:center;gap:16px}
.big .facts{display:grid;gap:4px}
.fact{font-size:16.5px}
.fact b{font-family:var(--font-display);font-weight:400;font-size:23px;margin-inline-end:6px}
.sec{padding:16px}
.sec h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin-bottom:12px}
.brow{margin-bottom:14px}
.brow:last-child{margin-bottom:0}
.brow-top{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;margin-bottom:6px}
.brow-top .dot{width:14px;height:14px;border-radius:50%;background:var(--cc);border:var(--bw) solid var(--line);flex:none}
.brow-top b{margin-inline-start:auto;font-family:var(--font-display);font-weight:400;font-size:21px}
.track{height:16px;background:var(--soft);border:var(--bw) solid var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--cc,var(--accent));border-inline-end:var(--bw) solid var(--line);border-radius:99px 0 0 99px}
.track i[style*="width:0%"]{border:0}
.muted{color:var(--muted)}
.note{font-size:15.5px;color:var(--muted);margin-top:10px}
.bal{display:flex;align-items:center;gap:12px;margin-top:6px;padding:10px 14px;border:var(--bw) solid var(--line);border-radius:calc(14px * var(--rs));background:var(--soft);font-weight:600;font-size:17px}
.bal b{font-family:var(--font-display);font-weight:400;font-size:24px}
.radar{display:block;width:100%;max-width:380px;margin:0 auto}
.radar text{fill:var(--ink);font-family:var(--font-body);font-weight:600;font-size:14.5px}
.bars{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;align-items:end;height:150px}
.bars.many{gap:2px}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bcol .bt{width:100%;flex:1;display:flex;align-items:flex-end}
.bcol .bt i{display:block;width:100%;background:var(--accent);border:var(--bw) solid var(--line);border-radius:6px 6px 0 0;min-height:4px}
.bcol.none .bt i{background:var(--soft);border-color:transparent}
.bcol.now .bt i{background:var(--star)}
.bcol .bv{font-size:13px;font-weight:700;line-height:1.2;height:17px}
.bcol .bl{font-size:13.5px;color:var(--muted);line-height:1.2;height:20px;white-space:nowrap;margin-top:4px}
.bars.many .bl{overflow:visible}

/* الجوائز */
.prize{padding:16px}
.starbig{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-size:42px;line-height:1.1}
.pbar{height:22px;background:var(--soft);border:var(--bw) solid var(--line);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.pbar i{display:block;height:100%;background:var(--star);border-inline-end:var(--bw) solid var(--line)}
.lv{display:inline-block;padding:0 12px;border:var(--bw) solid var(--line);border-radius:99px;font-weight:700;font-size:15px;line-height:26px;color:var(--on-solid);white-space:nowrap}
.lv0{background:var(--c-teal)} .lv1{background:var(--c-violet)} .lv2{background:var(--c-orange)} .lv3{background:var(--star)}
.mile{display:flex;align-items:center;gap:12px;padding:12px 14px;border:var(--bw) solid var(--line);border-radius:calc(16px * var(--rs));background:var(--surface);margin-bottom:10px}
.mile .st{flex:none;min-width:62px;text-align:center;font-family:var(--font-display);font-size:24px;line-height:1.1}
.mile .st small{display:block;font-family:var(--font-body);font-size:14px;color:var(--muted)}
.mile.lvbig{box-shadow:var(--sh) var(--sh) 0 var(--shadow)}
.mile.ready{background:var(--cb,var(--soft));box-shadow:var(--sh) var(--sh) 0 var(--shadow)}
.mile .mt{font-weight:700;font-size:17.5px;line-height:1.4}
details.hist{margin-top:14px}
details.hist summary{cursor:pointer;font-weight:700;font-size:17px;padding:8px 0}

/* الأهداف */
.gcard{padding:14px 16px;margin-top:14px;background:var(--cb)}
.gcard-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gcard-h h2{font-family:var(--font-display);font-weight:400;font-size:23px}
.gcard-h .dot{width:16px;height:16px;border-radius:50%;background:var(--cc);border:var(--bw) solid var(--line);flex:none}
.grow-item{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 12px;margin-bottom:8px;text-align:start;background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(14px * var(--rs));cursor:pointer}
.grow-item .gt{font-weight:600;font-size:17px;line-height:1.4}
.grow-item .gd{font-size:14.5px;color:var(--muted)}
.edit-ic{flex:none;color:var(--muted)}

/* ركن الأم */
.field{display:grid;gap:6px;margin-bottom:12px;font-weight:600;font-size:16.5px}
.field input,.field select{width:100%;min-height:50px;padding:8px 12px;background:var(--bg);color:var(--ink);border:var(--bw) solid var(--line);border-radius:calc(12px * var(--rs));font-size:17px}
.lvl{padding:12px;border:var(--bw) dashed var(--line);border-radius:calc(14px * var(--rs));margin-bottom:12px}
.lvl .field:last-child{margin-bottom:0}
.inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inline input{width:92px;min-height:48px;text-align:center}
.prev{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:16px}
.prev li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kidrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kidrow input{flex:1;min-width:0;min-height:48px;padding:6px 12px;background:var(--bg);color:var(--ink);border:var(--bw) solid var(--line);border-radius:calc(12px * var(--rs));font-size:17px}
.msg{margin-top:12px;font-weight:600;font-size:16px}
.msg.err{color:var(--bad)}

/* التبويب السفلي */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:var(--bw) solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:70px;background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer}
.nav button .ni{display:grid;place-items:center;width:46px;height:30px;border-radius:99px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ni{background:var(--star);color:#1E1B3F;border:var(--bw) solid var(--line)}

/* النوافذ */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,8,30,.55)}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--surface);border:var(--bw) solid var(--line);border-bottom:0;border-radius:calc(22px * var(--rs)) calc(22px * var(--rs)) 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-h h2{font-family:var(--font-display);font-weight:400;font-size:25px}
.kidpick{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 12px;margin-bottom:10px;text-align:start;background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(14px * var(--rs));cursor:pointer;font-weight:700;font-size:18px}
.kidpick[aria-current="true"]{background:var(--soft);box-shadow:var(--sh) var(--sh) 0 var(--shadow)}
.toast{position:fixed;inset-inline:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;max-width:420px;margin-inline:auto;padding:12px 16px;background:var(--ink);color:var(--bg);border-radius:calc(14px * var(--rs));font-weight:600;font-size:16.5px;text-align:center}
.confetti{position:fixed;top:30%;z-index:70;pointer-events:none;width:10px;height:14px;border:var(--bw) solid var(--line);border-radius:3px;animation:fall 1.3s ease-out forwards}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes spin{0%{transform:rotate(-80deg) scale(.5)}100%{transform:rotate(0) scale(1)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(60vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.goal.pop .chk,.goal.pop .g-star,.stars-chip.bump,.confetti{animation:none}}
@media (max-width:380px){.who-name{max-width:30vw}.title{font-size:24px}}

/* الإعدادات والثيمات */
.themeopt{display:flex;align-items:stretch;gap:8px;margin-bottom:10px}
.to-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 14px;text-align:start;background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(16px * var(--rs));cursor:pointer}
.to-main[aria-checked="true"]{background:var(--soft);box-shadow:var(--sh) var(--sh) 0 var(--shadow)}
.to-sw{flex:none;display:grid;grid-template-columns:repeat(3,18px);gap:3px}
.to-sw i{display:block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.to-name{display:block;font-weight:700;font-size:18px;line-height:1.4}
.to-desc{display:block;font-size:15px;color:var(--muted);line-height:1.45}
.to-check{flex:none;color:var(--accent)}
.themeopt .icon-btn{height:auto;min-height:72px;color:var(--bad)}
.themeopt .icon-btn.armed{background:var(--bad);color:#fff}
.g-title{font-family:var(--gfont,var(--font-body));font-size:calc(18px * var(--gs,1));font-weight:var(--gw,600)}
.grow-item .gt{font-family:var(--gfont,var(--font-body));font-size:calc(17px * var(--gs,1));font-weight:var(--gw,600)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--soft)}
.prow:last-child{border-bottom:0}
.prow .g-title{flex:1;min-width:0;line-height:1.45}
.prow:not(.done) .g-title{color:var(--muted)}
.prow.done .chk{background:var(--cc);color:var(--on-solid)}
.prow .pst{flex:none;color:var(--star)}
.prow .pst path{stroke:var(--line);stroke-width:1.5}
.grow-wrap{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.grow-wrap .grow-item{margin-bottom:0;flex:1;min-width:0}
.drag-h{flex:none;display:grid;place-items:center;width:44px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(14px * var(--rs));color:var(--muted);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.sortable-ghost{opacity:.4}
.snd-row{display:flex;align-items:center;gap:10px}.snd-row select{flex:1;min-width:0}.vol{width:100%;height:44px;accent-color:var(--accent)}.snd-off{opacity:.45;pointer-events:none}
.stl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:2px dashed var(--soft);font-size:16px}
.stl b{font-weight:700;overflow-wrap:anywhere;text-align:end}
.stl:last-of-type{border-bottom:0}
</style>
</head>
<body>

<header class="top" id="top"></header>
<main class="wrap" id="main"></main>

<nav class="nav" aria-label="التنقل">
  <div class="nav-in" id="nav">
    <button type="button" data-tab="today"><span class="ni"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg></span>اليوم</button>
    <button type="button" data-tab="progress"><span class="ni"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></span>تقدمي</button>

<script id="core">
/* ===== المنطق (بدون واجهة) ===== */
const DAYS_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const DAYS_SHORT = ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
const WEEK_ORDER = [6, 0, 1, 2, 3, 4, 5]; // الأسبوع يبدأ بالسبت
const MONTHS_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const COLORS = ['teal', 'blue', 'green', 'orange', 'pink', 'violet', 'red', 'slate'];
const nf = n => Number(n).toLocaleString('ar-EG', { useGrouping: false });
const pad = n => String(n).padStart(2, '0');
const key = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const weekStart = d => addDays(d, -((d.getDay() + 1) % 7));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pct = (done, exp) => exp ? Math.round(done / exp * 100) : null;
const hashPin = s => { let x = 5381; const t = 'kg:' + s; for (let i = 0; i < t.length; i++) x = ((x << 5) + x + t.charCodeAt(i)) | 0; return String(x >>> 0); };

const DEFAULT_LADDER = () => [
  { title: 'ساعة ألعاب أو ترفيه إضافية', every: 20 },
  { title: 'خروجة أو وجبة مفضلة', every: 5 },
  { title: 'هدية كبيرة تختارها مع الأم', every: 3 }
];
const SUGGEST = {
  org: ['ترتيب الحقيبة المدرسية', 'ترتيب المكتب', 'مساعدة في أعمال البيت'],
  study: ['قراءة ٢٠ دقيقة', 'حل الواجب كاملًا', 'مراجعة درس اليوم'],
  faith: ['أذكار الصباح والمساء', 'قراءة ورد من القرآن', 'الصلاة في وقتها'],
  skill: ['تعلّم مهارة جديدة ١٥ دقيقة', 'تمرين رياضة', 'الرسم أو الكتابة']
};

function defaultKid(name, color, ladder) {
  const t = key(new Date()), all = [0, 1, 2, 3, 4, 5, 6];
  const g = (cat, title, days) => ({ id: uid(), cat, title, days: days || all.slice(), stars: 1, created: t, archived: null });
  return {
    id: uid(), name: name || '', color: color || 'violet', updated: Date.now(),
    cats: [
      { id: 'org', name: 'تنظيم', color: 'teal', archived: false },
      { id: 'study', name: 'دراسية', color: 'blue', archived: false },
      { id: 'faith', name: 'دينية', color: 'green', archived: false },
      { id: 'skill', name: 'تطوير مهارات', color: 'orange', archived: false }
    ],
    goals: [
      g('org', 'غسل اللانش بوكس بعد ما يرجع من المدرسة', [0, 1, 2, 3, 4]),
      g('org', 'شرابات الغسيل في الباسكت'),
      g('org', 'رف الهدوم منظم'),
      g('org', 'رف الكتب منظم'),
      g('org', 'السرير مرتب'),
      g('org', 'تعليق أو طي الملابس'),
      g('org', 'غسيل الأسنان'),
      g('faith', 'الصلاة'),
      g('faith', 'حفظ ومراجعة القرآن'),
      g('study', 'المذاكرة')
    ],
    log: {}, claimed: {}, ladder: ladder ? JSON.parse(JSON.stringify(ladder)) : DEFAULT_LADDER()
  };
}

/* هل الهدف مطلوب في هذا اليوم؟ */
function expected(g, k) {
  return k >= g.created && (!g.archived || k < g.archived) && g.days.indexOf(parse(k).getDay()) !== -1;
}
function dayInfo(kid, k) {
  const goals = kid.goals.filter(g => expected(g, k));
  const log = kid.log[k] || {};
  return { goals, done: goals.filter(g => log[g.id]).length };
}
/* قيمة السجل = عدد النجوم التي نالها الطفل وقت الإنجاز (القيمة القديمة 1 تعني نجمة) */
const starsOf = v => { v = Math.round(Number(v)); return v >= 1 ? Math.min(5, v) : (v === 0 ? 0 : 1); };
function totalStars(kid) {
  let n = 0;
  Object.keys(kid.log).forEach(k => { Object.keys(kid.log[k]).forEach(id => { n += starsOf(kid.log[k][id]); }); });
  return n;
}
function firstDay(kid) {
  let m = key(new Date());
  kid.goals.forEach(g => { if (g.created < m) m = g.created; });
  return m;
}

/* إحصاء فترة: نسبة كل مجال والنسبة الكلية وعدد الأيام الكاملة والنجوم */
function rangeStats(kid, fromK, toK, now) {
  const today = key(now || new Date());
  const end = toK > today ? today : toK;
  const out = { cats: {}, exp: 0, done: 0, perfect: 0, days: 0, stars: 0 };
  if (fromK > end) return out;
  for (let d = parse(fromK); key(d) <= end; d = addDays(d, 1)) {
    const k = key(d), info = dayInfo(kid, k), log = kid.log[k] || {};
    if (!info.goals.length) continue;
    out.days++;
    info.goals.forEach(g => {
      const c = out.cats[g.cat] || (out.cats[g.cat] = { exp: 0, done: 0 });
      c.exp++; out.exp++;
      if (log[g.id]) { c.done++; out.done++; out.stars += starsOf(log[g.id]); }
    });
    if (info.done === info.goals.length) out.perfect++;
  }
  return out;
}

function periodRange(kid, period, offset, now) {
  now = now || new Date();
  const today = key(now);
  let from, to, label;
  if (period === 'day') {
    const d = addDays(now, offset); from = to = key(d);
    label = offset === 0 ? 'اليوم' : offset === -1 ? 'أمس' : DAYS_AR[d.getDay()] + ' ' + nf(d.getDate()) + ' ' + MONTHS_AR[d.getMonth()];
  } else if (period === 'week') {
    const s = addDays(weekStart(now), offset * 7), e = addDays(s, 6);
    from = key(s); to = key(e);
    label = s.getMonth() === e.getMonth() ? nf(s.getDate()) + ' – ' + nf(e.getDate()) + ' ' + MONTHS_AR[e.getMonth()] : nf(s.getDate()) + ' ' + MONTHS_AR[s.getMonth()] + ' – ' + nf(e.getDate()) + ' ' + MONTHS_AR[e.getMonth()];
    if (offset === 0) label = 'هذا الأسبوع';
  } else if (period === 'month') {
    const f = new Date(now.getFullYear(), now.getMonth() + offset, 1), l = new Date(now.getFullYear(), now.getMonth() + offset + 1, 0);
    from = key(f); to = key(l); label = offset === 0 ? 'هذا الشهر' : MONTHS_AR[f.getMonth()] + ' ' + nf(f.getFullYear());
  } else if (period === 'year') {
    const y = now.getFullYear() + offset;
    from = y + '-01-01'; to = y + '-12-31'; label = offset === 0 ? 'هذه السنة' : nf(y);
  } else {
    from = firstDay(kid); to = today; label = 'منذ البداية';
  }
  const start = firstDay(kid);
  return { from, to, label, canNext: period !== 'all' && offset < 0, canPrev: period !== 'all' && from > start };
}

/* أعمدة الرسم الزمني للفترة */
function trend(kid, period, offset, now) {
  now = now || new Date();
  const today = key(now), out = [];
  const monthBucket = (y, m, label) => {
    const f = new Date(y, m, 1), l = new Date(y, m + 1, 0), fk = key(f), lk = key(l);
    const s = rangeStats(kid, fk, lk);
    out.push({ label, pct: pct(s.done, s.exp), future: fk > today, now: today >= fk && today <= lk });
  };
  if (period === 'week') {
    const s = addDays(weekStart(now), offset * 7);
    for (let i = 0; i < 7; i++) {
      const d = addDays(s, i), k = key(d), info = dayInfo(kid, k);
      out.push({ label: DAYS_SHORT[d.getDay()], pct: k > today ? null : pct(info.done, info.goals.length), future: k > today, now: k === today });
    }
  } else if (period === 'month') {
    const f = new Date(now.getFullYear(), now.getMonth() + offset, 1), n = new Date(f.getFullYear(), f.getMonth() + 1, 0).getDate();
    for (let i = 1; i <= n; i++) {
      const d = new Date(f.getFullYear(), f.getMonth(), i), k = key(d), info = dayInfo(kid, k);
      out.push({ label: (i === 1 || i % 5 === 0) ? nf(i) : '', pct: k > today ? null : pct(info.done, info.goals.length), future: k > today, now: k === today });
    }
  } else if (period === 'year') {
    const y = now.getFullYear() + offset;
    for (let m = 0; m < 12; m++) monthBucket(y, m, nf(m + 1));
  } else {
    for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); monthBucket(d.getFullYear(), d.getMonth(), nf(d.getMonth() + 1)); }
  }
  return out;
}

function streak(kid, now) {
  let d = now || new Date();
  if (dayInfo(kid, key(d)).done < 1) d = addDays(d, -1);
  let n = 0;
  while (n < 3660 && dayInfo(kid, key(d)).done >= 1) { n++; d = addDays(d, -1); }
  return n;
}

/* التوازن بين المجالات */
function balance(kid, stats) {
  const rows = kid.cats.filter(c => !c.archived).map(c => {
    const s = stats.cats[c.id] || { exp: 0, done: 0 };
    return { cat: c, exp: s.exp, done: s.done, pct: pct(s.done, s.exp) };
  });
  const act = rows.filter(r => r.pct !== null);
  const res = { rows, active: act, state: 'few', score: null, weakest: null, strongest: null };
  if (act.length < 2) return res;
  const max = act.reduce((a, b) => b.pct > a.pct ? b : a), min = act.reduce((a, b) => b.pct < a.pct ? b : a);
  res.strongest = max; res.weakest = min;
  if (max.pct === 0) { res.state = 'zero'; return res; }
  res.score = 100 - (max.pct - min.pct);
  res.state = res.score >= 85 ? 'great' : res.score >= 70 ? 'good' : 'low';
  return res;
}

/* نظام الجوائز: كل ن نجمة جائزة، وكل ك جوائز ترتقي الجائزة لمستوى أعلى وهكذا */
function levelOf(ladder, m) {
  let level = 0, prod = 1;
  for (let i = 1; i < ladder.length; i++) { prod *= ladder[i].every; if (m % prod === 0) level = i; }
  return level;
}
function milestone(kid, m) {
  const level = levelOf(kid.ladder, m);
  return { m, stars: m * kid.ladder[0].every, level, title: kid.ladder[level].title };
}
function readyPrizes(kid, total) {
  const e = kid.ladder[0].every, max = Math.floor(total / e), out = [];
  for (let m = 1; m <= max; m++) { const ms = milestone(kid, m); if (!kid.claimed[String(ms.stars)]) out.push(ms); }
  return out;
}

/* ===== النصائح المختصرة =====
   تُحسب من بيانات اليوم فقط، بلا ذاكرة: balance = اختلال التوازن، near = اقتراب من إنجاز، cheer = تشجيع */
const TIP_GAP = 50;            // فرق (نقطة مئوية) بين أقوى وأضعف مجال في اليوم يُظهر نصيحة التوازن
const TIP_TARGETS = [80, 90, 100];
const TIP_REACH = 10;          // أقصى فرق عن النسبة المستهدفة ليُعتبر قريبًا
const TIP_MINDAYS = { week: 3, month: 7, year: 20 };
const TIP_PNAME = { week: 'هذا الأسبوع', month: 'هذا الشهر', year: 'هذه السنة' };
const seedOf = t => { let x = 7; for (let i = 0; i < t.length; i++) x = (x * 31 + t.charCodeAt(i)) >>> 0; return x; };
function tips(kid, now) {
  now = now || new Date();
  const dk = key(now), hour = now.getHours(), out = [], seed = seedOf(dk + kid.id);
  const pickV = (arr, o) => arr[(seed + (o || 0)) % arr.length];
  const act = {}; kid.cats.forEach(c => { if (!c.archived) act[c.id] = c; });
  const info = dayInfo(kid, dk), log = kid.log[dk] || {};
  const goals = info.goals.filter(g => act[g.cat]), left = goals.filter(g => !log[g.id]);
  const rows = {};
  goals.forEach(g => { const r = rows[g.cat] || (rows[g.cat] = { id: g.cat, name: act[g.cat].name, exp: 0, done: 0, pend: [] }); r.exp++; if (log[g.id]) r.done++; else r.pend.push(g); });
  const list = Object.keys(rows).map(id => { const r = rows[id]; r.pct = Math.round(r.done / r.exp * 100); return r; });
  const q = t => '«' + t + '»';
  let dayBalCat = null;

  // 1) توازن اليوم
  if (list.length >= 2 && goals.length - left.length >= 1) {
    const strong = list.reduce((a, b) => b.pct > a.pct ? b : a), weak = list.reduce((a, b) => b.pct < a.pct ? b : a);
    if (strong.pct - weak.pct >= TIP_GAP && weak.pend.length) {
      const S = q(strong.name), W = q(weak.name), G = q(weak.pend[0].title);
      const t = hour < 12 ? [`بداية قوية في ${S}! خلّينا نعطي ${W} دورًا أيضًا، نبدأ بـ${G}؟`, `${S} تقدّم ممتاز! وبعده نلحق ${W} بهدف سريع: ${G}.`]
        : hour < 18 ? [`${W} لسه ما أخذ نصيبه اليوم. هدف صغير منه، مثل ${G}، يوازن يومك قبل المساء.`, `يومك ماشي كويس في ${S}، وباقي لمسة في ${W} عشان يتوازن اليوم: ${G}.`]
        : [`فاضل من اليوم وقت قليل و${W} لسه ينتظر. هدف واحد منه، مثل ${G}، يكفي ليكتمل التوازن.`, `لسه فيه وقت! ${G} من ${W} يقفل اليوم متوازنًا.`];
      out.push({ id: 'bal-day:' + weak.id, kind: 'balance', text: pickV(t) });
      dayBalCat = weak.id;
    }
  }

  // 2) اقتراب من يوم كامل
  if (goals.length >= 3 && left.length >= 1 && left.length <= 2 && (goals.length - left.length) / goals.length >= 0.6) {
    const t = left.length === 1
      ? [`هدف واحد فقط يفصلك عن يوم كامل: ${q(left[0].title)}!`, `قربت جدًا! ${q(left[0].title)} وتكتمل كل أهداف اليوم.`]
      : [`هدفان فقط ويكتمل يومك! ${q(left[0].title)} و${q(left[1].title)}.`, `باقي هدفان وتحقق يومًا كاملًا، أنت قريب جدًا!`];
    out.push({ id: 'near-day', kind: 'near', text: pickV(t, 1) });
  }

  // 3) توازن الأسبوع
  const wk = periodRange(kid, 'week', 0, now), ws = rangeStats(kid, wk.from, wk.to, now);
  if (ws.days >= 2) {
    const b = balance(kid, ws);
    if (b.state === 'low' && b.weakest && b.strongest && b.weakest.cat.id !== dayBalCat) {
      const W = q(b.weakest.cat.name), S = q(b.strongest.cat.name);

  /* ===== تقرير PDF ===== */

  /* ===== الجوائز ===== */
  function lvBadge(l) { return `<span class="lv lv${l}">المستوى ${C.nf(l + 1)}</span>`; }
  function renderPrizes() {
    const k = K(), total = C.totalStars(k), e = k.ladder[0].every, nextM = Math.floor(total / e) + 1, nx = C.milestone(k, nextM);
    const prevStars = (nextM - 1) * e, prog = Math.min(100, Math.round((total - prevStars) / e * 100)), ready = C.readyPrizes(k, total);
    let h = `<section class="card prize"><div class="starbig num">${ic.star(46)}${C.nf(total)}</div><p class="sub">مجموع نجومك</p>` +
      `<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${prog}"><i style="width:${prog}%"></i></div>` +
      `<p class="num" style="font-weight:700;font-size:18px">باقي ${C.nf(nx.stars - total)} ${nx.stars - total === 1 ? 'نجمة' : 'نجوم'} للجائزة القادمة</p>` +
      `<p style="margin-top:6px;font-weight:700;font-size:19px">${escH(nx.title)} ${lvBadge(nx.level)}</p></section>`;

  /* ===== الأهداف ===== */
  let sortables = [];
  function reorderGoals(el) {
    const k = K(), cat = el.dataset.cat, ids = Array.from(el.children).map(x => x.dataset.gid), slots = [], byId = {};
    k.goals.forEach((g, i) => { byId[g.id] = g; if (g.cat === cat && !g.archived) slots.push(i); });
    const ordered = ids.map(id => byId[id]).filter(Boolean);
    if (ordered.length !== slots.length) return;
    slots.forEach((idx, j) => { k.goals[idx] = ordered[j]; });
    mut(); toast('تم حفظ الترتيب.');
  }
  function renderGoals() {
    sortables.forEach(x => { try { x.destroy(); } catch (e) {} }); sortables = [];
    const k = K();
    let h = `<div style="margin-top:14px"><h1 class="title">أهدافي</h1><p class="sub">أضف أهدافًا ومجالات جديدة، واختر الأيام التي يتكرر فيها كل هدف.</p></div>`;
    k.cats.filter(c => !c.archived).forEach(c => {
      const gs = k.goals.filter(g => g.cat === c.id && !g.archived);
      h += `<section class="card gcard cc-${c.color}"><div class="gcard-h"><span class="dot"></span><h2 class="grow">${escH(c.name)}</h2><button type="button" class="icon-btn" data-editcat="${c.id}" aria-label="تعديل المجال ${escH(c.name)}">${ic.edit(20)}</button></div>` +
        (gs.length ? `<div class="glist" data-cat="${c.id}">` + gs.map(g => `<div class="grow-wrap" data-gid="${g.id}"><span class="drag-h" role="img" aria-label="اسحب لتغيير الترتيب">${ic.grip(22)}</span><button type="button" class="grow-item" data-editgoal="${g.id}"><span class="grow"><span class="gt">${escH(g.title)}</span><br><span class="gd">${escH(daysText(g.days))}${(g.stars || 1) > 1 ? ' · ' + C.nf(g.stars) + ' نجوم' : ''}</span></span><span class="edit-ic">${ic.edit(20)}</span></button></div>`).join('') + `</div>` : `<p class="sub" style="margin-bottom:10px">لا توجد أهداف هنا بعد.</p>`) +
        `<button type="button" class="btn alt small" data-addgoal="${c.id}" style="width:100%">${ic.plus(20)}هدف جديد</button></section>`;
    });
    h += `<button type="button" class="btn alt" id="addCat" style="margin-top:14px">${ic.plus(22)}مجال جديد</button>`;

  }

  async function saveFile(blob, name, desc) {
    if (window.showSaveFilePicker) {
      try {
        const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: desc || 'نسخة احتياطية (JSON)', accept: { [blob.type]: ['.' + name.split('.').pop()] } }] });
        const w = await h.createWritable(); await w.write(blob); await w.close(); return true;
      } catch (err) { if (err && err.name === 'AbortError') return false; }
    }
    try {
      const fs = [new File([blob], name, { type: blob.type }), new File([blob], name, { type: 'text/plain' })];
      for (const f of fs) if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return true; }
    } catch (err) { if (err && err.name === 'AbortError') return false; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('تم التنزيل في مجلد «التنزيلات».'); return true;
  }

    const blob = new Blob([JSON.stringify({ app: 'kids-goals', version: 2, exportedAt: new Date().toISOString(), sum: bkSum(store.kids, store.current), kids: store.kids, current: store.current }, null, 1)], { type: 'application/json' });

  }

  async function importBackup(file) {
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) return bkMsg('الملف كبير جدًا.', true);
    let data; try { data = JSON.parse(await readText(file)); } catch (e) { return bkMsg('تعذّرت قراءة الملف. تأكد أنه نسخة احتياطية JSON من هذا التطبيق.', true); }
    if (!data || data.app !== 'kids-goals' || !data.kids || typeof data.kids !== 'object') return bkMsg('هذا الملف ليس نسخة احتياطية من هذا التطبيق.', true);
    if (data.sum && data.sum !== bkSum(data.kids, data.current)) return bkMsg('الملف تالف أو تم تعديله، فلم يُستورد. استخدم نسخة سليمة.', true);
    let add = 0, upd = 0, keep = 0; const blankId = store.current, cur = K();
    const blank = !cur.name && !Object.keys(cur.log).length && Object.keys(store.kids).length === 1;
    Object.keys(data.kids).forEach(id => {
      const v = C.cleanKid(data.kids[id]); if (!v) return;
      const ex = store.kids[v.id];
      if (!ex) { store.kids[v.id] = v; add++; } else if (v.updated > ex.updated) { store.kids[v.id] = v; upd++; } else keep++;
    });
    if (!add && !upd && !keep) return bkMsg('لم تُوجد بيانات صالحة في الملف.', true);
    if (blank && (add || upd) && store.kids[blankId] === cur) { delete store.kids[blankId]; store.current = store.kids[data.current] ? data.current : Object.keys(store.kids)[0]; }
    save(); renderTop(); renderSettings();
    const parts = []; if (add) parts.push(C.nf(add) + ' طفل جديد'); if (upd) parts.push(C.nf(upd) + ' تم تحديثه بنسخة أحدث'); if (keep) parts.push(C.nf(keep) + ' بقي كما هو لأن نسخته الحالية أحدث');
    bkMsg('تم الاستيراد: ' + parts.join('، ') + '.', false);
  }

      `<button type="button" class="sw" id="sndSw" role="switch" aria-checked="${sn.on}" aria-label="تشغيل الأصوات"></button></div>` +
      `<div class="${sn.on ? '' : 'snd-off'}" style="margin-top:14px"><label class="field">مستوى الصوت<input class="vol" id="sndVol" type="range" min="0" max="1" step=".05" value="${sn.vol}" aria-label="مستوى الصوت"></label>` +
      SND_EVENTS.map(([k, t]) => `<div class="field"><span>${t}</span><div class="snd-row"><select data-snd="${k}" aria-label="${t}">${tOpt(sn[k])}</select><button type="button" class="icon-btn" data-ptest="${k}" aria-label="تجربة الصوت">${ic.play(22)}</button></div></div>`).join('') + `</div></section>`;
    const fo = store.font, chip = (attr, val, label, on, extra) => `<button type="button" class="chipbtn" data-${attr}="${val}" aria-pressed="${on}"${extra || ''}>${label}</button>`;
    h += `<section class="card sec"><h2>الخط والحجم</h2><p class="sub" style="margin-bottom:12px">يغيّر شكل نص الأهداف فقط، في صفحة اليوم وصفحة أهدافي.</p>` +
      `<div class="goal" style="pointer-events:none;margin-bottom:6px" aria-hidden="true"><span class="chk">${ic.check(22)}</span><span class="g-title">مثال: ترتيب السرير بعد الاستيقاظ</span><span class="g-star">${ic.star(26)}</span></div>` +
      `<p class="field" style="margin:14px 0 8px">حجم خط الأهداف</p><div class="inline" role="group" aria-label="حجم خط الأهداف">${FONT_SIZES.map((x, i) => chip('fsize', i, x[0], fo.size === i)).join('')}</div>` +
      `<p class="field" style="margin:14px 0 8px">نوع الخط</p><div class="inline" role="group" aria-label="نوع الخط">${Object.keys(FONT_FAMS).map(f => chip('ffam', f, FONT_FAMS[f][0], fo.fam === f, ` style="font-family:${FONT_FAMS[f][1]}"`)).join('')}</div>` +
      `<p class="field" style="margin:14px 0 8px">سمك الخط</p><div class="inline${fo.fam === 'lalezar' ? ' snd-off' : ''}" role="group" aria-label="سمك الخط">${FONT_WEIGHTS.map(x => chip('fw', x[1], x[0], fo.w === x[1])).join('')}</div>` +
      (fo.fam === 'lalezar' ? `<p class="note">خط لالزار له سمك واحد، فلا يتغير سمكه.</p>` : '') +
      `<button type="button" class="btn alt small" id="fReset" style="margin-top:14px">الرجوع للافتراضي</button></section>`;
    const k = K();
    h += `<section class="card sec"><h2>الثيم</h2><div role="radiogroup" aria-label="الثيم">` + opts.map(o => {
      const sel = store.themeId === o.id;
      return `<div class="themeopt"><button type="button" class="to-main" role="radio" aria-checked="${sel}" data-pick-theme="${o.id}"><span class="to-sw">${swDots(o.t)}</span><span class="grow"><span class="to-name">${escH(o.name)}</span>${o.description ? `<span class="to-desc">${escH(o.description)}</span>` : ''}</span>${sel ? `<span class="to-check">${ic.check(26)}</span>` : ''}</button>` +
        (o.t ? `<button type="button" class="icon-btn" data-del-theme="${o.id}" aria-label="حذف الثيم ${escH(o.name)}">${ic.x(22)}</button>` : '') + `</div>`;
    }).join('') + `</div></section>`;
    h += `<section class="card sec"><h2>ثيم جديد من ملف</h2><p class="sub" style="margin-bottom:14px">استورد ملف JSON فيه ثيم واحد أو عدة ثيمات، فتُضاف إلى القائمة أعلاه ويُطبَّق أولها فورًا. الثيم الأساسي يبقى موجودًا دائمًا.</p>` +
      `<div class="stack" style="gap:10px"><button type="button" class="btn" id="thIn">${ic.up(22)}استيراد ثيم من ملف JSON</button><button type="button" class="btn alt" id="thTpl">${ic.down(22)}تنزيل ملف نموذجي للثيم</button></div>` +
      (thMsg ? `<p class="msg${thMsg.err ? ' err' : ''}" role="status">${escH(thMsg.text)}</p>` : '') + `</section>`;
    h += `<section class="card sec"><h2>حفظ البيانات</h2><p class="sub" style="margin-bottom:6px">كل البيانات محفوظة داخل هذا المتصفح فقط. صدّر نسخة احتياطية بين وقت وآخر، واستوردها عند الحاجة أو على جهاز آخر.</p><p class="sub num" id="bkInfo" style="margin-bottom:12px"></p>` +
      `<div class="stack" style="gap:10px"><button type="button" class="btn" id="bkOut">${ic.down(22)}تصدير نسخة احتياطية (JSON)</button><button type="button" class="btn alt" id="bkIn">${ic.up(22)}استيراد من ملف JSON</button><button type="button" class="btn danger" id="resetKid">مسح تقدم ${escH(kidName(k))} (النجوم والسجل)</button></div><p class="msg" id="bkMsg" role="status" hidden></p></section>`;
    h += `<section class="card sec"><h2>حالة التخزين</h2>${storageInfo().map(([k, v]) => `<div class="stl"><span>${escH(k)}</span><b>${escH(v)}</b></div>`).join('')}<p class="note">البيانات محفوظة في متصفح هذا الجهاز. قد يمسحها النظام إن لم يُستخدم التطبيق مدة، أو عند مسح بيانات المواقع، لذلك احفظ نسخة احتياطية دوريًا.</p>${hasCorrupt() ? `<button type="button" class="btn alt" id="dlCorrupt" style="margin-top:12px">${ic.down(22)}تنزيل النسخة التي تعذّرت قراءتها</button>` : ''}</section>`;
    $('main').innerHTML = `<div class="stack">${h}</div>`;
    renderBkInfo();
  }
  async function importTheme(file) {
    if (!file) return;
    const fail = text => { thMsg = { text, err: true }; renderSettings(); };
    if (file.size > 2 * 1024 * 1024) return fail('الملف كبير جدًا.');
    let data; try { data = JSON.parse(await readText(file)); } catch (e) { return fail('تعذّرت قراءة الملف. تأكد أنه ملف JSON صحيح.'); }
    if (!data || typeof data !== 'object' || data.app !== 'kids-goals-theme') return fail('هذا الملف ليس ملف ثيم لتطبيق نجومي.');
    const list = Array.isArray(data.themes) ? data.themes : [data];
    const good = [], seen = {}; let bad = 0;
    list.slice(0, 12).forEach(x => { const t = C.cleanTheme(x); if (!t) bad++; else if (!seen[t.id]) { seen[t.id] = 1; good.push(t); } });
    if (!good.length) return fail('لم يُوجد في الملف ثيم صالح. تحقق من الاسم والألوان.');
    let skipped = 0;
    good.forEach(t => { const i = store.themes.findIndex(x => x.id === t.id); if (i !== -1) store.themes[i] = t; else if (store.themes.length < 12) store.themes.push(t); else { skipped++; } });
    const first = good.find(t => store.themes.some(x => x.id === t.id));
    if (first) store.themeId = first.id;
    save(); applyTheme();
    const warns = first ? C.contrastWarnings(first) : [];
    thMsg = { err: false, text: 'تم استيراد ' + C.nf(good.length - skipped) + (good.length - skipped === 1 ? ' ثيم' : ' ثيمات') + (first ? ' وتطبيق «' + first.name + '».' : '.') + (bad ? ' تم تجاهل ' + C.nf(bad) + ' غير صالح.' : '') + (skipped ? ' لم تتسع القائمة لـ ' + C.nf(skipped) + ' (الحد ١٢ ثيمًا).' : '') + (warns.length ? ' تنبيه: ' + warns.join('، ') + '.' : '') };
    renderSettings();
  }
  async function exportThemeTemplate() {
    const blob = new Blob([JSON.stringify(C.themeTemplate(), null, 1)], { type: 'application/json' });
    const ok = await saveFile(blob, 'kids-goals-theme-template.json', 'ملف ثيم (JSON)');
    if (ok) { thMsg = { err: false, text: 'تم حفظ الملف النموذجي.' }; renderSettings(); }
  }
  $('themeFile').addEventListener('change', () => { const f = $('themeFile').files && $('themeFile').files[0]; $('themeFile').value = ''; importTheme(f); });

  /* ===== الأحداث ===== */
  $('main').addEventListener('input', e => { if (e.target.id === 'sndVol') store.snd.vol = +e.target.value; });
  $('main').addEventListener('change', e => {
    if (e.target.id === 'sndVol') { store.snd.vol = +e.target.value; save(); sfx('goal'); return; }
    const sel = e.target.closest('[data-snd]'); if (sel && TONES[sel.value] !== undefined || (sel && sel.value === 'off')) { store.snd[sel.dataset.snd] = sel.value; save(); if (store.snd.on && sel.value !== 'off') playTone(sel.value, store.snd.vol); }
  });
  $('top').addEventListener('click', e => {
    if (e.target.closest('#momBtn')) { askParent(() => { parentOk = true; ui.back = ui.tab === 'parent' ? 'today' : ui.tab; ui.tab = 'parent'; render(); window.scrollTo(0, 0); }); return; }
    if (e.target.closest('#whoBtn')) {
      const kids = Object.keys(store.kids).map(id => store.kids[id]);
      if (kids.length < 2) return;
      openSheet('من يستخدم التطبيق؟', kids.map(x => `<button type="button" class="kidpick" data-pick="${x.id}" aria-current="${x.id === store.current}"><span class="av cc-${x.color}">${escH(kidName(x).charAt(0))}</span><span class="grow">${escH(kidName(x))}</span><span class="num" style="display:inline-flex;align-items:center;gap:4px">${ic.star(20, 'var(--star)')}${C.nf(C.totalStars(x))}</span></button>`).join(''), { noFocus: true });
    }
  });
  $('layer').addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) { store.current = b.dataset.pick; save(); ui.dayOffset = 0; ui.offset = 0; closeSheet(); render(); } });
  $('nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; parentOk = false; ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });

  $('main').addEventListener('click', e => {
    const t = e.target;
    let b;
    if ((b = t.closest('[data-pick-theme]'))) { store.themeId = b.dataset.pickTheme; thMsg = null; save(); applyTheme(); return renderSettings(); }
    if ((b = t.closest('[data-del-theme]'))) {
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.classList.add('armed'); b.innerHTML = '<span style="font-size:14px;font-weight:700">تأكيد</span>'; return; }
      store.themes = store.themes.filter(x => x.id !== b.dataset.delTheme); if (store.themeId === b.dataset.delTheme) store.themeId = 'base';
      thMsg = null; save(); applyTheme(); return renderSettings();
    }
    if ((b = t.closest('[data-tipx]'))) {
      const today = todayKey(); if (store.tipsOff.day !== today) store.tipsOff = { day: today, ids: [] };
      if (store.tipsOff.ids.indexOf(b.dataset.tipx) === -1) store.tipsOff.ids.push(b.dataset.tipx);
      save(); return renderToday();
    }
    if ((b = t.closest('[data-fsize]'))) { store.font.size = +b.dataset.fsize; save(); applyFont(); return renderSettings(); }
    if ((b = t.closest('[data-ffam]'))) { store.font.fam = b.dataset.ffam; save(); applyFont(); return renderSettings(); }
    if ((b = t.closest('[data-fw]'))) { store.font.w = +b.dataset.fw; save(); applyFont(); return renderSettings(); }
    if (t.closest('#fReset')) { store.font = cleanFont(null); save(); applyFont(); return renderSettings(); }
    if (t.closest('#pdfOut')) return exportPdf();
    if (t.closest('#sndSw')) { store.snd.on = !store.snd.on; save(); renderSettings(); if (store.snd.on) sfx('goal'); return; }
    if ((b = t.closest('[data-ptest]'))) { if (!store.snd.on) return toast('الأصوات متوقفة. شغّلها أولًا.'); const id = store.snd[b.dataset.ptest]; if (id && id !== 'off') playTone(id, store.snd.vol); else toast('هذا الحدث بلا صوت.'); return; }
    if (t.closest('#tipsSw')) { store.tips = !store.tips; save(); return renderSettings(); }
    if (t.closest('#thIn')) return $('themeFile').click();
    if (t.closest('#thTpl')) return exportThemeTemplate();
    if ((b = t.closest('[data-goal]'))) return toggleGoal(b.dataset.goal);
    if ((b = t.closest('[data-go]'))) { ui.tab = b.dataset.go; render(); return; }
    if (t.closest('#dPrev')) { ui.dayOffset = Math.max(-6, ui.dayOffset - 1); return render(); }
    if (t.closest('#dNext')) { ui.dayOffset = Math.min(0, ui.dayOffset + 1); return render(); }
    if ((b = t.closest('[data-period]'))) { ui.period = b.dataset.period; ui.offset = 0; return render(); }
    if (t.closest('#rPrev')) { ui.offset--; return render(); }
    if (t.closest('#rNext')) { ui.offset = Math.min(0, ui.offset + 1); return render(); }
    if ((b = t.closest('[data-claim]'))) {
      const stars = Number(b.dataset.claim), k = K(), m = C.milestone(k, stars / k.ladder[0].every);
      return askParent(() => { k.claimed[String(stars)] = { t: Date.now(), title: m.title, level: m.level }; mut(); render(); toast('مبروك! استلمت جائزتك.'); sfx('prize'); }, 'تأكيد استلام الجائزة');
    }
    if ((b = t.closest('[data-editgoal]'))) return goalSheet(b.dataset.editgoal);
    if ((b = t.closest('[data-addgoal]'))) return goalSheet(null, b.dataset.addgoal);
    if ((b = t.closest('[data-editcat]'))) return catSheet(b.dataset.editcat);
    if (t.closest('#addCat')) return catSheet(null);
    // ركن الأم
    if (t.closest('#pBack')) { parentOk = false; ui.tab = ui.back || 'today'; return render(); }
    if (t.closest('#pinBtn')) return pinSheet();
    if (t.closest('#pinOff')) { store.pin = ''; save(); render(); return toast('تم إلغاء القفل.'); }
    if (t.closest('#lvAdd')) { const k = K(); k.ladder.push({ title: 'جائزة أكبر', every: 3 }); mut(); return render(); }
    if (t.closest('#lvDel')) { const k = K(); if (k.ladder.length > 1) { k.ladder.pop(); mut(); } return render(); }
    if (t.closest('#ladderAll')) { const k = K(); Object.keys(store.kids).forEach(id => { store.kids[id].ladder = JSON.parse(JSON.stringify(k.ladder)); store.kids[id].updated = Date.now(); }); save(); return toast('تم تطبيق النظام على كل الأبناء.'); }
    if (t.closest('#addKid')) {
      const name = $('newKid').value.trim(); if (!name) return toast('اكتب اسم الطفل أولًا.');
      const used = Object.keys(store.kids).map(id => store.kids[id].color), color = C.COLORS.find(c => used.indexOf(c) === -1 && ['violet', 'pink', 'blue', 'orange', 'green', 'teal', 'red'].indexOf(c) !== -1) || 'pink';
      const nk = C.defaultKid(name, color, K().ladder); store.kids[nk.id] = nk; save(); renderTop(); renderParent(); return toast('تمت إضافة ' + name + '.');
    }
    if ((b = t.closest('[data-delkid]'))) {
      const id = b.dataset.delkid;
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.classList.add('armed'); b.setAttribute('aria-label', 'اضغط للتأكيد'); b.innerHTML = '<span style="font-size:13px;font-weight:700">تأكيد</span>'; return; }
      delete store.kids[id]; if (store.current === id) store.current = Object.keys(store.kids)[0]; save(); renderTop(); renderParent(); return toast('تم حذف الطفل.');
    }
    if (t.closest('[data-bknow]')) return exportBackup().then(() => render());
    if (t.closest('[data-bkx]')) { try { localStorage.setItem(SNZ, String(Date.now())); } catch (e) {} return render(); }
    if (t.closest('[data-recx]')) { recovered = false; return render(); }
    if (t.closest('#dlCorrupt')) { let raw = ''; try { raw = localStorage.getItem(KEY + '.corrupt') || ''; } catch (e) {} return saveFile(new Blob([raw], { type: 'application/json' }), 'kids-goals-recovered-' + todayKey() + '.json'); }
    if (t.closest('#bkOut')) return exportBackup();
    if (t.closest('#bkIn')) return $('importFile').click();
    if (t.closest('#resetKid')) {
      const r = t.closest('#resetKid');
      if (!r.classList.contains('armed')) { r.classList.add('armed'); r.textContent = 'اضغط مرة أخرى للتأكيد'; return; }
      const k = K(); k.log = {}; k.claimed = {}; mut(); renderTop(); renderSettings(); return toast('تم مسح التقدم.');
    }
  });

  function render() {
    renderTop(); renderNav();
    if (ui.tab === 'today') renderToday(); else if (ui.tab === 'progress') renderProgress(); else if (ui.tab === 'prizes') renderPrizes(); else if (ui.tab === 'goals') renderGoals(); else if (ui.tab === 'settings') renderSettings(); else renderParent();
  }

  /* أول تشغيل: اسم الطفل */
  function welcome() {
    openSheet('أهلًا بك في نجومي', `<p class="sub" style="margin-bottom:14px">كل هدف تنجزه يمنحك نجمة، والنجوم تفتح جوائز. ما اسمك؟</p><label class="field">الاسم<input id="wName" maxlength="30" autocomplete="off"></label><p class="note" style="margin-top:-4px;margin-bottom:14px">تستطيع الأم إضافة باقي الأبناء من ركن الأم (أيقونة القفل).</p><p class="msg err" id="wErr" role="alert" hidden>اكتب اسمك أولًا.</p><button type="button" class="btn" id="wGo">هيا نبدأ</button>`, { lock: true });
    const go = () => { const v = $('wName').value.trim(); if (!v) { $('wErr').hidden = false; return; } K().name = v.slice(0, 30); mut(); closeSheet(); render(); };
    $('wGo').addEventListener('click', go); $('wName').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }

  applyTheme(); applyFont();
  render();
  askPersist().then(() => { if (ui.tab === 'parent') render(); });
  if (Object.keys(store.kids).length === 1 && !K().name && !Object.keys(K().log).length) welcome();
  save();
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
}
</script>
</body>
</html>
